# The QEMU aarch64 virt test disk (docs/linux/IMPLEMENTATION.md E.2, E.6;
# decisions I7, I8, I39).
#
# QEMU boots the kernel with -kernel (run-qemu.sh), so there is no idbloader
# and nothing is written to uboot or boot; the entries stay so the disk has
# the cards' table exactly: same names, types, order, offsets and entry
# numbers, and S00base and D60firstboot see what they see on a device.
#
#   1    uboot      16384  (8 MiB)   8 MiB    empty; spare 8 MiB
#   2    boot       49152  (24 MiB)  40 MiB   empty; spare 40 MiB
#   3    root       212992 (104 MiB) 1 GiB    EROFS; spare 1 GiB
#   4    data       4407296 (2152 MiB) 256 MiB ext4, mounted at /storage
#   5    info       4931584 (2408 MiB) 1 MiB  FAT12 THIMSY-INFO with README.TXT
#   -    (gap)      2409 MiB: the image ends at 2410 MiB with its backup GPT
#   6    games      4937728 (2411 MiB) made at first boot by D60firstboot
#                   (exFAT, label THIMSY), or re-adopted when a re-written
#                   image finds the old library there
#
# info is the only entry vold mounts (OA-2; rk3566/genimage.cfg says why),
# and 30-genimage.sh adds the pinned GUIDs (OA-9).
# tools/gpt_check.py checks this file (tests/test_layout.py) and every image
# written from it (post-image.d/40-gpt-check.sh).

image thimsy-qemu-aarch64-virt.img {
	# The image ends 1 MiB after info, and D60firstboot puts games 2 MiB
	# after it: the image's backup GPT (its last 33 sectors) ends 1 MiB
	# before games, so writing the image again over a used card leaves the
	# old library's boot region alone (E.6, device-safety-2).
	size = 2410M

	hdimage {
		partition-table-type = "gpt"
	}

	partition uboot {
		partition-type-uuid = "8DA63339-0007-60C0-C436-083AC8230908"
		offset = 8M
		size = 8M
	}

	partition boot {
		partition-type-uuid = "8DA63339-0007-60C0-C436-083AC8230908"
		offset = 24M
		size = 40M
	}

	partition root {
		partition-type-uuid = "B921B045-1DF0-41C3-AF44-4C6F280D3FAE"
		image = "rootfs.erofs"
		offset = 104M
		size = 1G
	}

	partition data {
		partition-type-uuid = "933AC7E1-2EB4-4F13-B844-0E14E2AEF915"
		image = "data.ext4"
		offset = 2152M
		size = 256M
	}

	partition info {
		partition-type-uuid = "EBD0A0A2-B9E5-4433-87C0-68B6B72699C7"
		image = "info.vfat"
		offset = 2408M
		size = 1M
	}
}
