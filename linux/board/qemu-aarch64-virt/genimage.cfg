# The QEMU aarch64 virt test disk (docs/linux/IMPLEMENTATION.md E.2, E.6;
# decisions I7, I8, I39).
#
# QEMU boots the kernel with -kernel (run-qemu.sh), so there is no idbloader
# and nothing is written to uboot or boot; the entries stay so the disk has
# the cards' table exactly: same names, types, order, offsets and entry
# numbers, and S00base and D60firstboot see what they see on a device.
#
#   1    uboot      16384  (8 MiB)   8 MiB    empty; spare 8 MiB
#   2    boot       49152  (24 MiB)  40 MiB   empty; spare 40 MiB
#   3    root       212992 (104 MiB) 1 GiB    EROFS; spare 1 GiB
#   4    data       4407296 (2152 MiB) 256 MiB ext4, mounted at /storage
#   -    games      made at first boot by D60firstboot (exFAT, label THIMSY)
#
# tools/gpt_check.py checks this file (tests/test_layout.py) and every image
# written from it (post-image.d/40-gpt-check.sh).

image thimsy-qemu-aarch64-virt.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition uboot {
		partition-type-uuid = "8DA63339-0007-60C0-C436-083AC8230908"
		offset = 8M
		size = 8M
	}

	partition boot {
		partition-type-uuid = "8DA63339-0007-60C0-C436-083AC8230908"
		offset = 24M
		size = 40M
	}

	partition root {
		partition-type-uuid = "B921B045-1DF0-41C3-AF44-4C6F280D3FAE"
		image = "rootfs.erofs"
		offset = 104M
		size = 1G
	}

	partition data {
		partition-type-uuid = "933AC7E1-2EB4-4F13-B844-0E14E2AEF915"
		image = "data.ext4"
		offset = 2152M
		size = 256M
	}
}
