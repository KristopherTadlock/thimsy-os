# /etc/thimsy/init.conf: tunables for the init scripts, sourced by
# /usr/share/thimsy/init/lib.sh. Shell assignments only; no commands.
# SPDX-License-Identifier: MIT

# Mount options of the data partition at /storage.
THIMSY_DATA_MOUNT_OPTS=noatime,nosuid,nodev

# The games partition D60firstboot makes (IMPLEMENTATION E.6): GPT name,
# exFAT label, and the least free space worth a partition.
THIMSY_GAMES_NAME=games
THIMSY_GAMES_LABEL=THIMSY
THIMSY_GAMES_MIN_MIB=64

# BusyBox ntpd's peers (D40time).
THIMSY_NTP_SERVERS="0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org"
