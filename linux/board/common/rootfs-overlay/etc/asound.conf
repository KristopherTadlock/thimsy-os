# /etc/asound.conf: ALSA's "default" mixes (review finding linux-host-impls-3).
# SPDX-License-Identifier: MIT
#
# Nano keeps several streams open at once (the music, the UI sounds, the boot
# and menu sound players), and the game it starts opens "default" while they
# are still open. A card without a cards/<driver>.conf in alsa-lib (the
# rk817 and simple-audio-card codecs, for example) gets plug over hw, which
# one stream holds alone; so "default" here is plug over a dmix on the
# device's card, shared by every process (ipc_perm), and "default"'s control
# is that card's.
#
# The card is ALSA_CARD (an index or a card id), which thimsy-session puts in
# Nano's environment from device.json's audio.card_index (so every game Nano
# starts has it too); 0 without it. The rate, period and buffer are a first
# choice, not yet checked on a unit.

pcm.!default {
	type plug
	slave.pcm "thimsy_dmix"
}

ctl.!default {
	type hw
	card {
		@func getenv
		vars [ ALSA_CARD ]
		default "0"
	}
}

pcm.thimsy_dmix {
	type dmix
	ipc_key 20260311
	ipc_key_add_uid false
	ipc_perm 0666
	slave {
		pcm {
			type hw
			card {
				@func getenv
				vars [ ALSA_CARD ]
				default "0"
			}
			device 0
		}
		format S16_LE
		channels 2
		rate 48000
		period_size 512
		buffer_size 2048
	}
	bindings {
		0 0
		1 1
	}
}
