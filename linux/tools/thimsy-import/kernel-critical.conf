# Thimsy-critical kernel options: the conformance check (thimsy-import, kconfig.py) fails
# when ROCKNIX's base config merged with Thimsy's fragment (board/<family>/linux.fragment)
# does not give each of these exactly this value. "=n" means "is not set".
# A comment line right above an option says why it is critical.
# Values marked (guess) are unverified on hardware.

[all]
# EROFS root (decision 25); "# CONFIG_EROFS_FS is not set" in ROCKNIX's RK3566 and H700 configs
CONFIG_EROFS_FS=y
# no initramfs: ROCKNIX's configs carry "@INITRAMFS_SOURCE@" for its own build
CONFIG_INITRAMFS_SOURCE=""
# FlipBase's /init mounts devtmpfs; padd unlinks source nodes from it
CONFIG_DEVTMPFS=y
# thimsy-padd reads evdev and writes uinput (plan 5.3)
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_UINPUT=y
# the data partition (ext4) and the games partition (exFAT), found by GPT name
CONFIG_EXT4_FS=y
CONFIG_EXFAT_FS=y
CONFIG_EFI_PARTITION=y
# sleep and wake (thimsy-session's SleepPlan)
CONFIG_PM_SLEEP=y

[RK3566]
# Panfrost built in: nothing loads modules on hotplug (guess that =y probes in time)
CONFIG_DRM_PANFROST=y
CONFIG_DRM_ROCKCHIP=y

[H700]
CONFIG_DRM_PANFROST=y
