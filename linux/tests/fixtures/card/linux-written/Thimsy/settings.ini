# Thimsy settings. Edit with any text editor while the card is out of the device.
# Delete a line (or this file) to go back to the defaults. Docs: LIBRARY-FORMAT.md 4.21
# Key names here are illustrative; tools/nano-tree/prefs.json will fix them (portable_settings_plan.md).
[meta]
format = 1
id = 6f1c2e0a-5b3d-4c1e-9a7f-2d8e4b6c1a90

[general]
language = de-DE
# date_format = 0         (0 = DD/MM/YYYY, 1 = MM/DD/YYYY, 2 = YYYY-MM-DD)

[esde_theme]
set = colorful-simplified-es-de
variant = default
color_scheme = colorful-dark

[device.anbernic-rg-arc-d]
esde_theme.aspect_ratio = 4:3

[android]
shader.enable = on

[linux]
portmaster.show = on
# end of Thimsy settings
